[build]
  command = "CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags=\"-s -w\" -o netlify/functions/server ./cmd/netlify"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  GO_VERSION = "1.26.5"
  CGO_ENABLED = "0"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
